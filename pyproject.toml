[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-lands"
version = "1.0.0"
description = "Production-grade Real Estate Intelligence Platform with Hybrid RAG"
authors = [{name = "Zuu Crew AI Engineer", email = "engineer@zuucrew.ai"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    
    # Logging
    "loguru>=0.7.0",
    
    # Web Crawling
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    
    # NLP & Chunking
    "spacy>=3.7.0",
    "tiktoken>=0.5.0",
    "nltk>=3.8.0",
    "sentence-transformers>=2.2.0",
    
    # Vector Database
    "qdrant-client>=1.7.0",
    "fastembed>=0.2.0",
    
    # API Clients
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    
    # Embeddings & Reranking
    "transformers>=4.36.0",
    
    # Evaluation
    "ragas>=0.1.0",
    "datasets>=2.16.0",
    
    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    
    # Utilities
    "tqdm>=4.66.0",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "ipython>=8.19.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
